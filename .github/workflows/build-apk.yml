name: Build Signed Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Vite)
        run: npm run build

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      # 注入带 release 签名配置的 app/build.gradle（与 @capacitor/android 6.2.2 模板对应）
      - name: Apply release signing gradle
        run: cp ci/app.build.gradle android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      # 将 base64 编码的签名密钥解码为 keystore 文件（不入库，仅存在于 runner）
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "Keystore bytes: $(wc -c < android/app/release.keystore)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build signed release APK
        working-directory: ./android
        env:
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: prompt-optimizer-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
